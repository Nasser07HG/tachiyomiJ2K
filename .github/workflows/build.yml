name: Build APK and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          mkdir -p app app/src/standard app/src/dev
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-project",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                  "android_client_info": {
                    "package_name": "eu.kanade.tachiyomi.j2k"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummykey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/standard/google-services.json
          cp app/google-services.json app/src/dev/google-services.json

      - name: Build APK (Release)
        run: ./gradlew assembleStandardRelease -x lint -x test

      - name: Sign APK (armeabi-v7a)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"
          APK_PATH=$(find app/build/outputs/apk/standard/release/ -name "*armeabi-v7a*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias releasekey --ks-pass pass:password --key-pass pass:password --out app-signed.apk "$APK_PATH"

      - name: Compress APK Package
        run: |
          mkdir -p final_output
          zip -j final_output/app-release-armeabi-v7a-signed.zip app-signed.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiJ2K-armeabi-v7a-Signed
          path: final_output/app-release-armeabi-v7a-signed.zip
          
