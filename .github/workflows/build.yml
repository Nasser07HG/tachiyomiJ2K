name: Build APK and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          mkdir -p app app/src/standard app/src/dev
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-project",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                  "android_client_info": {
                    "package_name": "eu.kanade.tachiyomi.j2k"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/standard/google-services.json
          cp app/google-services.json app/src/dev/google-services.json

      - name: Build APK (Release)
        run: ./gradlew assembleStandardRelease -x lint -x test

      - name: Compress APK Package (arm64-v8a Only)
        run: |
          mkdir -p final_output
          find app/build/outputs/apk/standard/release/ -name "*arm64-v8a*.apk" -exec zip -j final_output/app-release-arm64-v8a.zip {} +

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiJ2K-arm64-v8a-Release
          path: final_output/app-release-arm64-v8a.zip
          
